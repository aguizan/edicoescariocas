<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Edições Cariocas (dev)</title>
<style>
  *{box-sizing:border-box}
  body{font-family:'Georgia',serif;max-width:900px;margin:0 auto;padding:24px 20px 60px;color:#1a1a1a;background:#faf9f7}
  h1{font-size:24px;margin:0 0 4px}
  .aviso{font-size:12px;color:#a15c00;background:#fff3e0;border:1px solid #ffddb0;padding:8px 12px;border-radius:6px;margin-bottom:20px}
  #login, #painel{display:none}
  #login.show, #painel.show{display:block}
  label{display:block;font-size:13px;color:#555;margin-top:12px}
  input, select, textarea{width:100%;padding:9px 10px;border:1px solid #ccc;border-radius:6px;font-family:inherit;font-size:15px;margin-top:4px}
  textarea{resize:vertical;min-height:80px}
  button{cursor:pointer;font-family:inherit}
  .btn{padding:10px 18px;border:none;border-radius:6px;background:#1a1a1a;color:#fff;font-size:14px;margin-top:14px}
  .btn.secundario{background:#eee;color:#1a1a1a}
  .btn.perigo{background:#a11}
  .erro{color:#a11;font-size:13px;margin-top:8px}
  .barra{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
  .sair{font-size:13px;color:#666;background:none;border:none;text-decoration:underline}
  .cartao{background:#fff;border:1px solid #e2ddd4;border-radius:8px;padding:16px;margin-top:14px}
  .cartao h3{margin:0 0 4px;font-size:17px}
  .cartao .meta{font-size:12px;color:#888;margin-bottom:8px}
  .linha-acoes-lista{display:flex;gap:8px;margin-top:10px}
  .cartao .linha-acoes-lista button{padding:7px 12px;border-radius:5px;border:1px solid #ccc;background:#fff;font-size:13px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:#eee;margin-left:6px}
</style>
</head>
<body>

<div class="aviso">Ambiente de <strong>desenvolvimento</strong> — banco de teste, isolado do site publicado.</div>

<div id="login">
  <h1>Entrar no admin</h1>
  <label>E-mail<input type="email" id="login-email" autocomplete="username"></label>
  <label>Senha<input type="password" id="login-senha" autocomplete="current-password"></label>
  <button class="btn" id="btn-entrar">Entrar</button>
  <div class="erro" id="login-erro"></div>
</div>

<div id="painel">
  <div class="barra">
    <h1>Livros</h1>
    <button class="sair" id="btn-sair">Sair</button>
  </div>

  <div class="cartao">
    <h3 id="form-titulo">Novo livro</h3>
    <input type="hidden" id="livro-id">
    <label>Título<input type="text" id="f-titulo"></label>
    <label>Subtítulo<input type="text" id="f-subtitulo"></label>
    <div class="grid2">
      <label>Autor
        <select id="f-autor"></select>
      </label>
      <label>Status
        <select id="f-status">
          <option value="rascunho">Rascunho</option>
          <option value="publicado">Publicado</option>
          <option value="esgotado">Esgotado</option>
          <option value="em_breve">Em breve</option>
        </select>
      </label>
    </div>
    <div class="grid2">
      <label>Preço físico (R$)<input type="number" step="0.01" id="f-preco-fisico"></label>
      <label>Preço e-book (R$)<input type="number" step="0.01" id="f-preco-ebook"></label>
    </div>
    <label>Selo (ex.: Lançamento)<input type="text" id="f-selo"></label>
    <label>URL da capa<input type="text" id="f-capa"></label>
    <label>Sinopse<textarea id="f-sinopse"></textarea></label>
    <div class="linha-acoes">
      <button class="btn" id="btn-salvar">Salvar</button>
      <button class="btn secundario" id="btn-cancelar" style="display:none">Cancelar edição</button>
    </div>
    <div class="erro" id="form-erro"></div>
  </div>

  <div id="lista-livros">Carregando…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient(
  'https://sesmrschobtglcqxvkyb.supabase.co',
  'sb_publishable_c4-E0NfPcHXTm3L0p-Zi_g_Fy7RwQya'
);

const elLogin = document.getElementById('login');
const elPainel = document.getElementById('painel');

async function verificarSessao() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    elLogin.classList.remove('show');
    elPainel.classList.add('show');
    await carregarAutores();
    await carregarLivros();
  } else {
    elPainel.classList.remove('show');
    elLogin.classList.add('show');
  }
}

document.getElementById('btn-entrar').addEventListener('click', async () => {
  const email = document.getElementById('login-email').value.trim();
  const senha = document.getElementById('login-senha').value;
  const erroEl = document.getElementById('login-erro');
  erroEl.textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email, password: senha });
  if (error) { erroEl.textContent = 'Erro: ' + error.message; return; }
  verificarSessao();
});

document.getElementById('btn-sair').addEventListener('click', async () => {
  await sb.auth.signOut();
  verificarSessao();
});

async function carregarAutores() {
  const sel = document.getElementById('f-autor');
  const { data, error } = await sb.from('autores').select('id, nome').order('nome');
  sel.innerHTML = '<option value="">— selecione —</option>' + (data || []).map(a => '<option value="' + a.id + '">' + a.nome + '</option>').join('');
}

function limparForm() {
  document.getElementById('livro-id').value = '';
  document.getElementById('f-titulo').value = '';
  document.getElementById('f-subtitulo').value = '';
  document.getElementById('f-autor').value = '';
  document.getElementById('f-status').value = 'rascunho';
  document.getElementById('f-preco-fisico').value = '';
  document.getElementById('f-preco-ebook').value = '';
  document.getElementById('f-selo').value = '';
  document.getElementById('f-capa').value = '';
  document.getElementById('f-sinopse').value = '';
  document.getElementById('form-titulo').textContent = 'Novo livro';
  document.getElementById('btn-cancelar').style.display = 'none';
}

document.getElementById('btn-cancelar').addEventListener('click', limparForm);

document.getElementById('btn-salvar').addEventListener('click', async () => {
  const erroEl = document.getElementById('form-erro');
  erroEl.textContent = '';
  const id = document.getElementById('livro-id').value;
  const registro = {
    titulo: document.getElementById('f-titulo').value.trim(),
    subtitulo: document.getElementById('f-subtitulo').value.trim() || null,
    autor_id: document.getElementById('f-autor').value || null,
    status: document.getElementById('f-status').value,
    preco_fisico: document.getElementById('f-preco-fisico').value ? parseFloat(document.getElementById('f-preco-fisico').value) : null,
    preco_ebook: document.getElementById('f-preco-ebook').value ? parseFloat(document.getElementById('f-preco-ebook').value) : null,
    selo: document.getElementById('f-selo').value.trim() || null,
    capa_url: document.getElementById('f-capa').value.trim() || null,
    sinopse: document.getElementById('f-sinopse').value.trim() || null
  };
  if (!registro.titulo) { erroEl.textContent = 'Título é obrigatório.'; return; }

  let resultado;
  if (id) {
    resultado = await sb.from('livros').update(registro).eq('id', id);
  } else {
    resultado = await sb.from('livros').insert(registro);
  }
  if (resultado.error) { erroEl.textContent = 'Erro ao salvar: ' + resultado.error.message; return; }
  limparForm();
  carregarLivros();
});

async function editarLivro(id) {
  const { data, error } = await sb.from('livros').select('*').eq('id', id).single();
  if (error || !data) return;
  document.getElementById('livro-id').value = data.id;
  document.getElementById('f-titulo').value = data.titulo || '';
  document.getElementById('f-subtitulo').value = data.subtitulo || '';
  document.getElementById('f-autor').value = data.autor_id || '';
  document.getElementById('f-status').value = data.status || 'rascunho';
  document.getElementById('f-preco-fisico').value = data.preco_fisico || '';
  document.getElementById('f-preco-ebook').value = data.preco_ebook || '';
  document.getElementById('f-selo').value = data.selo || '';
  document.getElementById('f-capa').value = data.capa_url || '';
  document.getElementById('f-sinopse').value = data.sinopse || '';
  document.getElementById('form-titulo').textContent = 'Editando: ' + data.titulo;
  document.getElementById('btn-cancelar').style.display = 'inline-block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function excluirLivro(id, titulo) {
  if (!confirm('Excluir "' + titulo + '"? Essa ação não pode ser desfeita.')) return;
  const { error, count } = await sb.from('livros').delete().eq('id', id).select();
  if (error) { alert('Erro ao excluir: ' + error.message); console.error(error); return; }
  carregarLivros();
}

async function carregarLivros() {
  const lista = document.getElementById('lista-livros');
  const { data, error } = await sb.from('livros').select('*, autores(nome)').order('criado_em', { ascending: false });
  if (error) { lista.innerHTML = '<p class="erro">Erro ao carregar: ' + error.message + '</p>'; return; }
  if (!data.length) { lista.innerHTML = '<p>Nenhum livro cadastrado ainda.</p>'; return; }
  lista.innerHTML = data.map(l => {
    const autor = l.autores ? l.autores.nome : '(sem autor)';
    const precos = [];
    if (l.preco_fisico) precos.push('Físico R$ ' + Number(l.preco_fisico).toFixed(2).replace('.', ','));
    if (l.preco_ebook) precos.push('E-book R$ ' + Number(l.preco_ebook).toFixed(2).replace('.', ','));
    return '<div class="cartao">'
      + '<h3>' + l.titulo + '<span class="tag">' + l.status + '</span></h3>'
      + '<div class="meta">' + autor + (precos.length ? ' · ' + precos.join(' · ') : '') + '</div>'
      + '<div class="linha-acoes-lista">'
      + '<button data-editar="' + l.id + '">Editar</button>'
      + '<button class="perigo" style="color:#a11" data-excluir="' + l.id + '" data-titulo="' + l.titulo.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;') + '">Excluir</button>'
      + '</div></div>';
  }).join('');
  lista.querySelectorAll('[data-editar]').forEach(b => b.addEventListener('click', () => editarLivro(b.getAttribute('data-editar'))));
  lista.querySelectorAll('[data-excluir]').forEach(b => b.addEventListener('click', () => excluirLivro(b.getAttribute('data-excluir'), b.getAttribute('data-titulo'))));
}

verificarSessao();
</script>
</body>
</html>
